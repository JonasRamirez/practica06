AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Laboratorio reservations backend (Lambda + DynamoDB).

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref ReservationsTable

Parameters:
  ReservationsTableName:
    Type: String
    Default: LabReservations
    Description: DynamoDB table name to store reservations.

Resources:
  ReservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ReservationsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: reservationDate
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: reservationDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  ReservationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: reservations.handler
      Description: Create and list lab reservations
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReservationsTable
      Events:
        Reservations:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /reservations
            Method: ANY

Outputs:
  ApiEndpoint:
    Description: Invoke URL for the API Gateway stage
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  ReservationsTableOutput:
    Description: DynamoDB table name used by the API
    Value: !Ref ReservationsTable
